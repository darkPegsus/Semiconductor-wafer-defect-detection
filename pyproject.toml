[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-wafer-defect-detection"
version = "0.1.0"
description = "AI-powered semiconductor wafer defect detection and classification using deep learning (PyTorch, ResNet-18, Custom CNN, Grad-CAM, Streamlit)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Semiconductor Wafer Defect Detection Team" }
]
keywords = [
    "semiconductor",
    "wafer-defect-detection",
    "deep-learning",
    "pytorch",
    "computer-vision",
    "wm-811k",
    "resnet18",
    "grad-cam",
    "streamlit"
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchinfo>=1.8.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.2",
    "scipy>=1.13.1",
    "scikit-learn>=1.5.1",
    "opencv-python-headless>=4.10.0.84",
    "grad-cam>=1.5.4",
    "streamlit>=1.39.0",
    "plotly>=5.24.1",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.2",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
    "mypy>=1.11.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.0.0",
    "pre-commit>=3.8.0",
]

# ------------------------------------------------------------------------------
# Ruff Configuration (Linting and Formatting)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "app"]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (Python 3.12+ syntax modernization)
    "N",   # pep8-naming
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function call in argument defaults (useful for FastAPI / Typer if added)
    "N812",  # Allow lowercase functional imported as non-lowercase F (PyTorch convention)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Fast, isolated unit tests not requiring large dataset files",
    "integration: Integration tests exercising end-to-end component pipelines",
    "slow: Tests with long execution times or heavy tensor computation",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ------------------------------------------------------------------------------
# Coverage Reporting Configuration
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "app/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

# ------------------------------------------------------------------------------
# Mypy Static Type Checking
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
